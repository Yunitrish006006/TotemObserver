name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TotemObserver
        uses: actions/checkout@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: 424b90dc3929caa8c1afcfca7e63c50a64bde669
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Test graphics wrapper process cleanup
        run: python3 .github/scripts/test-run-glx-client.py

      - name: Build pinned TotemCore
        shell: bash
        run: |
          set -euo pipefail
          (cd .lockstep/TotemCore && ./gradlew assemble --no-daemon --stacktrace)

      - name: Test and assemble TotemObserver
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.23'
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./gradlew -PtotemCoreJar="$core_jar" clean test assemble compileGametestJava runGameTest prepareAccountFixture --no-daemon --stacktrace

      - name: Store JVM and GameTest failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observer-jvm-gametest-reports
          if-no-files-found: warn
          path: |
            build/junit.xml
            build/reports/
            build/test-results/
            build/gametest/logs/
            build/gametest/crash-reports/
            build/run/gameTest/logs/
            build/run/gameTest/crash-reports/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Validate and build Flutter client
        working-directory: client_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build web --release --no-web-resources-cdn

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify browser account flow
        working-directory: client_flutter/browser_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-web-client-and-browser-evidence
          path: |
            client_flutter/build/web
            build/account-browser-evidence/*.png
            build/account-browser-evidence/result.json

      - name: Enforce Observer extraction invariants
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$version"
          test -f "build/libs/totem-observer-${version}.jar"
          ! grep -R -n 'dev\.totem\.vanillatweaks' src/main/java
          ! grep -R -n 'TotemVanillaTweaks' src/main/java
          ! grep -R -n 'dev\.totem\.observer\.observer' src/main/java
          test "$(find src/test/java -name 'Observer*Test.java' | wc -l)" -ge 4
          ! grep -R -n 'dev\.totem\.vanillatweaks' src/test/java
          grep -F 'PROTOCOL_NAMESPACE = "totem-vanilla-tweaks"' src/main/java/dev/totem/observer/TotemObserver.java
          grep -F '"java": ">=25"' src/main/resources/fabric.mod.json
          grep -F '"totem-core": ">=0.7.23 <0.8.0"' src/main/resources/fabric.mod.json
          forbidden='Screenshot\.takeScreenshot|FrameChunk|FrameRelay|DynamicTexture|ObserverFrameRules|observer_frame_chunk|observer_frame_relay|observer_capture_control'
          if grep -R -n -E "$forbidden" src/main; then
            echo 'Framebuffer transport code entered TotemObserver.' >&2
            exit 1
          fi
          bash .github/scripts/check-owned-observer-screens.sh .

      - name: Bind validated release artifact to this Build
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          core_source="$(git -C .lockstep/TotemCore rev-parse HEAD)"
          test "$core_source" = 424b90dc3929caa8c1afcfca7e63c50a64bde669
          core_sha="$(sha512sum .lockstep/TotemCore/build/libs/totem-core-0.7.23.jar | awk '{print $1}')"
          test "$core_sha" = "$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          mkdir -p build/release-artifact
          cp "build/libs/${artifact}" build/release-artifact/
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core_source "$core_source" --arg core_sha "$core_sha" '{repository:$repository,source_commit:$source,run_id:$run,run_attempt:$attempt,version:$version,artifact:$artifact,sha512:$sha,core_version:"0.7.23",core_source_commit:$core_source,core_artifact_sha512:$core_sha}' > build/release-artifact/build-provenance.json

      - name: Upload immutable validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 14
