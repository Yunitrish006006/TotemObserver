name: Dart Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - name: Print formatter diff
        working-directory: client_flutter
        shell: bash
        run: |
          set -euo pipefail
          dart format test/connection_test.dart
          git diff -- test/connection_test.dart
          git diff --quiet -- test/connection_test.dart
