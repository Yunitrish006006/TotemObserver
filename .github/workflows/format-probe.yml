name: Format Probe

on:
  push:
    branches:
      - feat/world-section-contract

permissions:
  contents: write

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Apply formatter output
        working-directory: client_flutter
        run: |
          dart format lib/connection.dart test/world_section_test.dart
          cd ..
          if ! git diff --quiet -- client_flutter/lib/connection.dart client_flutter/test/world_section_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client_flutter/lib/connection.dart client_flutter/test/world_section_test.dart
            git commit -m "style: format world section client"
            git push origin HEAD:feat/world-section-contract
          fi
