name: Publish Modrinth

on:
  push:
    branches: [main, 'release/**']
    paths:
      - gradle.properties
      - .github/workflows/publish-modrinth.yml
      - .github/scripts/publish-modrinth.py
      - .github/scripts/test-publish-modrinth.py
      - .github/staging/modrinth-changelog-*.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without uploading a version
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: modrinth-observer
  cancel-in-progress: false

env:
  CORE_REF: 424b90dc3929caa8c1afcfca7e63c50a64bde669

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate project before building
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: python3 .github/scripts/publish-modrinth.py --check-project
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Test publisher policies
        run: python3 .github/scripts/test-publish-modrinth.py
      - name: Require exact-source release gates
        id: gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "source=$release_sha" >> "$GITHUB_OUTPUT"
          for workflow in build.yml observer-runtime-validation.yml observer-e2e.yml; do
            passed=false
            for attempt in {1..120}; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${release_sha}&event=push&per_page=10")"
              latest="$(jq -c '.workflow_runs | sort_by(.run_number) | last // null' <<<"$runs")"
              if [[ "$(jq -r '.status // empty' <<<"$latest")" == completed ]]; then
                jq -e --arg sha "$release_sha" --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_sha==$sha and .event=="push" and .repository.full_name==$repo' <<<"$latest" >/dev/null
                if [[ "$workflow" == build.yml ]]; then
                  echo "run_id=$(jq -er .id <<<"$latest")" >> "$GITHUB_OUTPUT"
                  echo "run_attempt=$(jq -er .run_attempt <<<"$latest")" >> "$GITHUB_OUTPUT"
                fi
                passed=true
                break
              fi
              sleep 10
            done
            test "$passed" = true || { echo "Timed out waiting for ${workflow}; refusing publication." >&2; exit 1; }
          done

          echo "OBSERVER_RELEASE_GATES=$release_sha" >> "$GITHUB_ENV"

      - name: Resolve immutable artifact identity
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "release-${RELEASE_SHA}-${BUILD_RUN_ATTEMPT}" --arg run "$BUILD_RUN_ID" --arg source "$RELEASE_SHA" '[.[].artifacts[] | select(.name==$name)] | select(length==1) | .[0] | select(.expired==false and .size_in_bytes>0 and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$source) | .id' <<<"$artifacts")"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true
          path: build/libs
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable artifact provenance and SHA512
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          expected_sha="$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          core_sha="$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          test "$sha" = "$expected_sha"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$RELEASE_SHA" --arg run "$BUILD_RUN_ID" --arg attempt "$BUILD_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core "$CORE_REF" --arg core_sha "$core_sha" '.repository==$repo and .source_commit==$source and .run_id==$run and .run_attempt==$attempt and .version==$version and .artifact==$artifact and .sha512==$sha and .core_version=="0.7.23" and .core_source_commit==$core and .core_artifact_sha512==$core_sha' build/libs/build-provenance.json >/dev/null

      - name: Validate authenticated project and version
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != false
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: python3 .github/scripts/publish-modrinth.py
      - name: Upload and verify version
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: python3 .github/scripts/publish-modrinth.py --publish
      - name: Retain artifact and sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-modrinth-${{ github.sha }}
          path: |
            build/libs/totem-observer-*.jar
            build/modrinth-release/*.json
          if-no-files-found: warn
      - name: Record verified publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence=build/modrinth-release/validation.json
          version="$(jq -er .version "$evidence")"
          jq --arg run "$GITHUB_RUN_ID" --arg ref "$GITHUB_SHA" '. + {verified_by_run:$run,release_ref:$ref}' "$evidence" > /tmp/observer-publication.json
          marker=".github/staging/modrinth-published-${version}.json"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/staging?ref=main" --jq ".[] | select(.name == \"modrinth-published-${version}.json\") | .sha")"
          jq -n --arg message "release: record Modrinth ${version} [skip ci]" --arg content "$(base64 -w0 /tmp/observer-publication.json)" --arg sha "$existing" \
            '{message:$message,content:$content,branch:"main"} + (if $sha == "" then {} else {sha:$sha} end)' > /tmp/observer-marker-request.json
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${marker}" --input /tmp/observer-marker-request.json >/dev/null
