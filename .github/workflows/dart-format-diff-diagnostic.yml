name: Dart Format Diff Diagnostic

on:
  push:
    branches:
      - feat/world-section-unavailable-response

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show exact formatter diff
        working-directory: client_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format test/world_section_test.dart
          git diff -- test/world_section_test.dart
