name: Dart Format Visible View Diagnostic

on:
  push:
    branches:
      - feat/world-visible-view-policy

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Show exact formatter diff
        working-directory: client_flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/main.dart lib/world_visible_view.dart test/world_visible_view_test.dart
          git diff -- lib/main.dart lib/world_visible_view.dart test/world_visible_view_test.dart
