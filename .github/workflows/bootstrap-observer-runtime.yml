# bootstrap revision 4
name: Bootstrap Observer Runtime

on:
  push:
    branches:
      - feat/bootstrap-observer-runtime
    paths:
      - .github/workflows/bootstrap-observer-runtime.yml

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out TotemObserver
        uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-observer-runtime
          fetch-depth: 0

      - name: Check out verified Observer source
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemVanillaTweaks
          ref: 7b451cedd5cc4f646df10178b3d14b26ff4689ff
          path: .source
          persist-credentials: false

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: f87cd10fe8aefce77925b9e75dad237f17f38966
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Prepare extracted module
        run: bash .github/bootstrap-observer-runtime.sh prepare

      - name: Extract Observer accessor mixins
        run: bash .github/bootstrap-observer-accessors.sh

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build pinned TotemCore
        run: (cd .lockstep/TotemCore && ./gradlew assemble --no-daemon --stacktrace)

      - name: Compile extracted Observer runtime
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-0.7.18.jar"
          ./gradlew -PtotemCoreJar="$core_jar" clean test assemble --no-daemon --stacktrace

      - name: Verify and commit extraction
        shell: bash
        run: |
          rm -f .github/bootstrap-observer-accessors.sh
          bash .github/bootstrap-observer-runtime.sh verify-commit
